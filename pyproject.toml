[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gayatri-ai"
version = "3.0.0"
description = "Gayatri AI — Local-first agentic AI platform with fine-tuned LLM"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.12,<3.13"
authors = [{name = "Gayatri Education"}]

dependencies = [
    "PySide6>=6.11.0",
    "llama-cpp-python>=0.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.6.0",
]
cuda = [
    "llama-cpp-python[cuda]>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN", "S", "T20", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "gui: tests that require Qt GUI or WebEngine display (Audit #TEST-003)",
    "headless: pure logic unit and integration tests that can run headless in CI",
    "slow: tests that take longer than 5 seconds",
]
